site_name: GoldenTellus
site_url: https://goldentellus.github.io/goldentellus-home
repo_url: https://github.com/GoldenTellus/goldentellus-home
repo_name: GoldenTellus/goldentellus-home
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: deep orange
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: deep orange
      accent: amber
nav:
  - Home: index.md
  - For Developers: for-developers.md
  - For Enterprises: for-enterprise.md
  - Capabilities: capabilities.md
  - SNAO Overview: snao-overview.md
  - Contributing: CONTRIBUTING.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
