site_name: GoldenTellus | FDE Pipeline Community
site_url: https://goldentellus.github.io/goldentellus-home
repo_url: https://github.com/GoldenTellus/goldentellus-home
repo_name: GoldenTellus/goldentellus-home
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
      primary: deep orange
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
      primary: deep orange
      accent: amber
nav:
  - 首页: index.md
  - 我们的理念: manifest.md
  - 新人入口: for-beginner.md
  - 企业入口: for-enterprise.md
  - FDE 入口: for-fde.md
  - 知识库:
      - knowledge/index.md
      - 00 流水线基础: knowledge/00-pipeline-fundamentals/index.md
      - 01 Lead FDE: knowledge/01-lead-fde/index.md
      - 02 Analyst: knowledge/02-analyst/index.md
      - 03 Architect: knowledge/03-architect/index.md
      - 04 Builder: knowledge/04-builder/index.md
      - 05 Data Engineer: knowledge/05-data-engineer/index.md
      - 06 Integrator: knowledge/06-integrator/index.md
      - 07 Ops: knowledge/07-ops/index.md
      - 99 跨工位: knowledge/99-general/index.md
  - 案例库: cases/index.md
  - 仓库导航: navigation.md
  - 贡献指南: CONTRIBUTING.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
